# Configuración del servidor de medios. La escribe `instalar.sh` con las
# llaves generadas; este archivo es la plantilla comentada de referencia.

port: 7880

rtc:
  # Rango UDP por donde viaja el video. Tiene que estar abierto en el
  # firewall de Vultr, no solo en el del sistema.
  port_range_start: 50000
  port_range_end: 60000
  # Puerto TCP de respaldo: hay redes corporativas que bloquean UDP entero.
  # Sin esto, esa gente no ve nada y no sabe por qué.
  tcp_port: 7881
  use_external_ip: true

# TURN propio: los pares tras NAT simétrico (~10 % de las redes) no logran
# conectar sin un relevo. Es la diferencia entre "no me carga el video" y
# que funcione.
turn:
  enabled: true
  domain: SALA_DOMINIO
  tls_port: 5349
  udp_port: 3478
  # El certificado lo maneja Caddy; LiveKit recibe el tráfico ya descifrado.
  external_tls: true

keys:
  API_KEY: API_SECRET

logging:
  level: info

# Sin nadie dentro, la sala se cierra sola y libera memoria.
room:
  empty_timeout: 300
  max_participants: 300
